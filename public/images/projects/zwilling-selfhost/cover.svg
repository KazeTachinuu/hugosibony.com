<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750"
     font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif">
  <rect width="1200" height="750" fill="#f2ede5"/>

  <defs>
    <filter id="ph" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#3a2f1e" flood-opacity="0.18"/>
    </filter>
    <clipPath id="screen"><rect x="176" y="95" width="328" height="560" rx="30"/></clipPath>
  </defs>

  <!-- ── the FRESH & SAVE app (brand: cream + red) ─────────────────────── -->
  <rect x="150" y="65" width="380" height="620" rx="48" fill="#1b1a17" filter="url(#ph)"/>
  <rect x="308" y="82" width="64" height="9" rx="4.5" fill="#3a3a37"/>
  <rect x="176" y="95" width="328" height="560" rx="30" fill="#ffffff"/>

  <g clip-path="url(#screen)">
    <!-- red brand header -->
    <rect x="176" y="95" width="328" height="104" fill="#e2231a"/>
    <text x="340" y="152" text-anchor="middle" font-size="25" font-weight="800"
          letter-spacing="4" fill="#ffffff">FRESH &amp; SAVE</text>
    <text x="340" y="180" text-anchor="middle" font-size="13" letter-spacing="3" fill="#ffd9d6">MY FRIDGE</text>

    <!-- inventory, sorted fresh -> expiring -->
    <g>
      <rect x="204" y="232" width="48" height="48" rx="13" fill="#3fb950"/>
      <rect x="268" y="242" width="176" height="17" rx="8.5" fill="#e9e3da"/><rect x="268" y="268" width="96" height="11" rx="5.5" fill="#efe9e1"/>

      <rect x="204" y="304" width="48" height="48" rx="13" fill="#3fb950"/>
      <rect x="268" y="314" width="150" height="17" rx="8.5" fill="#e9e3da"/><rect x="268" y="340" width="80" height="11" rx="5.5" fill="#efe9e1"/>

      <rect x="204" y="376" width="48" height="48" rx="13" fill="#d29922"/>
      <rect x="268" y="386" width="166" height="17" rx="8.5" fill="#e9e3da"/><rect x="268" y="412" width="88" height="11" rx="5.5" fill="#efe9e1"/>

      <rect x="204" y="448" width="48" height="48" rx="13" fill="#e2231a"/>
      <rect x="268" y="458" width="132" height="17" rx="8.5" fill="#e9e3da"/><rect x="268" y="484" width="72" height="11" rx="5.5" fill="#efe9e1"/>

      <rect x="204" y="520" width="48" height="48" rx="13" fill="#d8d1c7"/>
      <rect x="268" y="530" width="112" height="17" rx="8.5" fill="#eee8e0"/><rect x="268" y="556" width="60" height="11" rx="5.5" fill="#f1ece4"/>
    </g>
    <!-- bottom bar -->
    <rect x="176" y="611" width="328" height="44" fill="#faf7f2"/>
    <circle cx="340" cy="633" r="15" fill="#e2231a"/>
  </g>

  <!-- ── headline: what the project is ────────────────────────────────── -->
  <text x="612" y="300" font-size="60" font-weight="800" fill="#1b1a17">The app,</text>
  <text x="612" y="368" font-size="60" font-weight="800" fill="#e2231a">self-hosted.</text>

  <!-- timeline bar: official shutdown -> self-hosted keeps running -->
  <text x="877" y="462" text-anchor="middle" font-size="38" font-weight="800" fill="#1b1a17">2026-12-31</text>
  <rect x="614" y="498" width="438" height="22" rx="11" fill="#e6ded1"/>
  <rect x="614" y="498" width="263" height="22" rx="11" fill="#c8433a"/>
  <rect x="877" y="498" width="175" height="22" rx="11" fill="#3fb950"/>
  <polyline points="1046,500 1070,509 1046,518" fill="none" stroke="#3fb950" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="877" y1="474" x2="877" y2="544" stroke="#1b1a17" stroke-width="3"/>
  <circle cx="877" cy="509" r="10" fill="#1b1a17"/>
  <text x="745" y="572" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="2" fill="#a49d90">OFFICIAL</text>
  <text x="965" y="572" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="2" fill="#3fb950">SELF-HOSTED</text>
</svg>
