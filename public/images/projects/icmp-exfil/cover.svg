<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
  <rect width="1200" height="750" fill="#0f1319"/>
  <g transform="translate(0,20)">
  <!-- sender host -->
  <rect x="90" y="285" width="200" height="150" rx="16" fill="#161c26" stroke="#2a3341" stroke-width="2"/>
  <rect x="126" y="329" width="128" height="14" rx="7" fill="#58a6ff"/>
  <rect x="126" y="359" width="86" height="14" rx="7" fill="#3a4557"/>
  <rect x="126" y="389" width="106" height="14" rx="7" fill="#3a4557"/>

  <!-- receiver host -->
  <rect x="910" y="285" width="200" height="150" rx="16" fill="#161c26" stroke="#2a3341" stroke-width="2"/>
  <rect x="946" y="329" width="128" height="14" rx="7" fill="#3fb950"/>
  <rect x="946" y="359" width="86" height="14" rx="7" fill="#3a4557"/>
  <rect x="946" y="389" width="106" height="14" rx="7" fill="#3a4557"/>

  <!-- link -->
  <line x1="290" y1="360" x2="910" y2="360" stroke="#2a3341" stroke-width="2" stroke-dasharray="10 12"/>

  <!-- echo ping rings from sender -->
  <g fill="none" stroke="#58a6ff" stroke-width="2">
    <circle cx="290" cy="360" r="30" opacity="0.55"/>
    <circle cx="290" cy="360" r="54" opacity="0.3"/>
    <circle cx="290" cy="360" r="78" opacity="0.15"/>
  </g>

  <!-- ICMP echo packet in flight: header cells + hidden payload -->
  <g transform="translate(470,300)">
    <rect x="-8" y="-8" width="276" height="136" rx="16" fill="#0c0f14" stroke="#2a3341" stroke-width="2"/>
    <!-- header fields (type, code, checksum, id/seq) -->
    <g fill="#58a6ff">
      <rect x="20" y="20" width="52" height="30" rx="6"/>
      <rect x="84" y="20" width="52" height="30" rx="6"/>
      <rect x="148" y="20" width="100" height="30" rx="6" opacity="0.55"/>
    </g>
    <!-- payload = hidden message bytes (exfil) -->
    <g fill="#f85149">
      <rect x="20" y="72" width="26" height="30" rx="6"/>
      <rect x="58" y="72" width="26" height="30" rx="6"/>
      <rect x="96" y="72" width="26" height="30" rx="6"/>
      <rect x="134" y="72" width="26" height="30" rx="6"/>
      <rect x="172" y="72" width="26" height="30" rx="6"/>
    </g>
  </g>

  <!-- direction arrow -->
  <g stroke="#3fb950" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="620" y1="470" x2="770" y2="470"/>
    <polyline points="748,452 772,470 748,488"/>
  </g>
  </g>
</svg>
