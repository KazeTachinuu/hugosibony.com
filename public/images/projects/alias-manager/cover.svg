<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
  <rect width="1200" height="750" fill="#0f1319"/>

  <!-- alias = a short keycap that expands to a full command -->
  <g>
    <!-- row 1 -->
    <rect x="232" y="180" width="188" height="118" rx="20" fill="#161c26" stroke="#2a3341" stroke-width="2"/>
    <text x="326" y="258" text-anchor="middle" font-size="58" font-weight="700" fill="#58a6ff">gs</text>
    <g stroke="#3fb950" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="452" y1="239" x2="560" y2="239"/><polyline points="540,223 562,239 540,255"/>
    </g>
    <text x="602" y="258" font-size="50" fill="#dbe2ea">git status</text>

    <!-- row 2 -->
    <rect x="232" y="316" width="188" height="118" rx="20" fill="#161c26" stroke="#2a3341" stroke-width="2"/>
    <text x="326" y="394" text-anchor="middle" font-size="58" font-weight="700" fill="#58a6ff">gl</text>
    <g stroke="#3fb950" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="452" y1="375" x2="560" y2="375"/><polyline points="540,359 562,375 540,391"/>
    </g>
    <text x="602" y="394" font-size="50" fill="#dbe2ea">git log</text>

    <!-- row 3 -->
    <rect x="232" y="452" width="188" height="118" rx="20" fill="#161c26" stroke="#2a3341" stroke-width="2"/>
    <text x="326" y="530" text-anchor="middle" font-size="58" font-weight="700" fill="#58a6ff">gp</text>
    <g stroke="#3fb950" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="452" y1="511" x2="560" y2="511"/><polyline points="540,495 562,511 540,527"/>
    </g>
    <text x="602" y="530" font-size="50" fill="#dbe2ea">git push</text>
  </g>
</svg>
