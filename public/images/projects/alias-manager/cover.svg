<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
  <rect width="1200" height="750" fill="#0f1319"/>
  <rect x="90" y="110" width="1020" height="460" rx="14" fill="#161c26" stroke="#2a3341" stroke-width="2"/>
  <text x="140" y="200" font-size="32"><tspan fill="#3fb950">❯</tspan><tspan fill="#dbe2ea" x="185"> am list</tspan></text>
  <g font-size="30">
    <text x="185" y="270"><tspan fill="#58a6ff">gs</tspan><tspan fill="#7d8899" x="300">=</tspan><tspan fill="#dbe2ea" x="360">git status</tspan></text>
    <text x="185" y="330"><tspan fill="#58a6ff">gl</tspan><tspan fill="#7d8899" x="300">=</tspan><tspan fill="#dbe2ea" x="360">git log --oneline</tspan></text>
    <text x="185" y="390"><tspan fill="#58a6ff">..</tspan><tspan fill="#7d8899" x="300">=</tspan><tspan fill="#dbe2ea" x="360">cd ..</tspan></text>
  </g>
  <text x="140" y="490" font-size="32"><tspan fill="#3fb950">❯</tspan><tspan fill="#dbe2ea" x="185"> am add gp "git push"</tspan></text>
  <rect x="610" y="464" width="18" height="36" fill="#3fb950"/>
  <line x1="0" y1="672" x2="1200" y2="672" stroke="#2a3341" stroke-width="2"/>
  <text x="90" y="717" font-size="22" letter-spacing="3" fill="#7d8899">ALIAS MANAGER</text>
  <text x="1110" y="717" font-size="22" letter-spacing="3" fill="#58a6ff" text-anchor="end">WRITTEN IN C</text>
</svg>
