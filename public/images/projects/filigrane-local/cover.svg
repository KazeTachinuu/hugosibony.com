  <circle cx="134" cy="199" r="6" fill="#f85149"/>
  <circle cx="156" cy="199" r="6" fill="#d29922"/>
  <circle cx="178" cy="199" r="6" fill="#3fb950"/>
  <rect x="214" y="189" width="360" height="20" rx="10" fill="#161c26"/>

  <!-- the document (an ID) -->
  <rect x="150" y="250" width="470" height="322" rx="10" fill="#e9ecf1"/>
  <g clip-path="url(#paper)">
    <!-- photo -->
    <rect x="182" y="286" width="108" height="132" rx="8" fill="#c4ccd8"/>
    <circle cx="236" cy="330" r="26" fill="#aab4c2"/>
    <path d="M198 418 a38 32 0 0 1 76 0 z" fill="#aab4c2"/>
    <!-- fields -->
    <g fill="#b9c2cf">
      <rect x="316" y="292" width="188" height="16" rx="8"/>
      <rect x="316" y="326" width="150" height="11" rx="5.5"/>
      <rect x="316" y="352" width="172" height="11" rx="5.5"/>
      <rect x="316" y="392" width="120" height="11" rx="5.5"/>
      <rect x="182" y="450" width="406" height="11" rx="5.5"/>
      <rect x="182" y="478" width="406" height="11" rx="5.5"/>
      <rect x="182" y="506" width="300" height="11" rx="5.5"/>
    </g>
    <!-- watermark applied across the whole doc -->
    <g transform="rotate(-27 385 411)" fill="#1e4f8f" opacity="0.26" font-size="30" font-weight="700" letter-spacing="6">
      <text x="120" y="300">FILIGRANE · FILIGRANE</text>
      <text x="120" y="366">FILIGRANE · FILIGRANE</text>
      <text x="120" y="432">FILIGRANE · FILIGRANE</text>
      <text x="120" y="498">FILIGRANE · FILIGRANE</text>
      <text x="120" y="564">FILIGRANE · FILIGRANE</text>
    </g>
