  <line x1="852" y1="432" x2="1074" y2="288" stroke="#f85149" stroke-width="9" stroke-linecap="round"/>
  <text x="963" y="486" text-anchor="middle" font-size="22" font-weight="700" letter-spacing="3" fill="#7d8899">STAYS ON DEVICE</text>
</svg>
