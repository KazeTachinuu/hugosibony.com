  <!-- counterweight: nothing is uploaded -->
  <g transform="translate(858,266)" stroke="#7d8899" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M44 150 a44 44 0 0 1 6 -87 a60 60 0 0 1 114 16 a38 38 0 0 1 -8 71 z"/>
